services:
  - type: web
    name: skylight-mcp
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: SKYLIGHT_TOKEN
        sync: false
      - key: SKYLIGHT_AUTH_TYPE
        value: bearer
      - key: SKYLIGHT_TIMEZONE
        value: America/New_York
