<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      color: #202124;
      background: #f8f9fa;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #1a73e8;
    }
    p {
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 14px 0;
      color: #5f6368;
    }
    button {
      width: 100%;
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #1e8e3e;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <h3>🔑 Skylight Token Helper</h3>
  <p>Make sure you are viewing <b>app.ourskylight.com</b> while logged into your account.</p>
  <button id="copyBtn">📋 Copy Token for AI Agents</button>
  <div id="status">✅ Copied to Clipboard!</div>
  <script src="popup.js"></script>
</body>
</html>
